<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteWave - Minhas Medalhas</title>

    <link rel="stylesheet" href="../css/medalhas.css">
</head>

<script>
    const cards = document.querySelectorAll(".card-medalha");
    const modal = document.getElementById("modalConquista");
    const conteudoModal = document.getElementById("conteudoModal");
    const btnFechar = document.getElementById("btnFecharModal");
    
    cards.forEach(card => {
    
        card.addEventListener("click", () => {
    
            const status = card.dataset.status;
            const titulo = card.dataset.titulo;
    
            if(status === "desbloqueado"){
    
                conteudoModal.innerHTML = `
                    <div class="modal-header">
    
                        <span class="tag-sucesso">
                            🎵 Conquista Desbloqueada
                        </span>
    
                        <h2>${titulo}</h2>
    
                    </div>
    
                    <div class="estrelas">
                        ⭐ ⭐ ⭐
                    </div>
    
                    <div class="modal-secao">
                        <h3>🏆 O que você conquistou?</h3>
    
                        <p>${card.dataset.conquistou}</p>
                    </div>
    
                    <div class="modal-secao">
    
                        <h3>📖 O que você aprendeu?</h3>
    
                        <p>${card.dataset.aprendeu}</p>
    
                    </div>
    
                    <div class="modal-secao incentivo">
    
                        <p>
                            💙
                            <strong>
                                ${card.dataset.incentivo}
                            </strong>
                        </p>
    
                    </div>
                `;
    
            }
    
            else{
    
                conteudoModal.innerHTML = `
    
                    <div class="modal-header">
    
                        <span class="tag-bloqueado">
    
                            🔒 Medalha Bloqueada
    
                        </span>
    
                        <h2>${titulo}</h2>
    
                    </div>
    
                    <div class="estrelas bloqueadas">
    
                        ☆ ☆ ☆
    
                    </div>
    
                    <div class="modal-secao">
    
                        <h3>Você ainda não conquistou esta medalha.</h3>
    
                        <p>
                            Continue realizando as atividades do NoteWave para desbloqueá-la.
                        </p>
    
                    </div>
    
                    <div class="modal-secao incentivo">
    
                        <p>
    
                            🎵 Cada músico começou exatamente onde você está agora.
                            Continue praticando e essa medalha será sua!
    
                        </p>
    
                    </div>
    
                `;
    
            }
    
            modal.classList.add("visivel");
    
        });
    
    });
    
    btnFechar.addEventListener("click", () => {
    
        modal.classList.remove("visivel");
    
    });
    
    modal.addEventListener("click", (e)=>{
    
        if(e.target === modal){
    
            modal.classList.remove("visivel");
    
        }
    
    });
    
    document.addEventListener("keydown",(e)=>{
    
        if(e.key==="Escape"){
    
            modal.classList.remove("visivel");
    
        }
    
    });
    </script>
    
    </body>
    </html>
